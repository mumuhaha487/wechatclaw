name: Build macOS app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify checkpoint files, permissions and rollback on macOS
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { Checkpoints } from './backend/checkpoints.mjs';
          import { Store } from './backend/store.mjs';
          import { App } from './backend/app.mjs';
          import { ConversationArchive } from './backend/conversations.mjs';
          const temporary = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP,'qqclaw-checkpoint-'));
          const workspace = path.join(temporary,'workspace');
          await fs.mkdir(workspace);
          const native = async (method,{value}) => method === 'vault.encrypt' ? Buffer.from(value).toString('base64') : Buffer.from(value,'base64').toString();
          const checkpoint = new Checkpoints(path.join(temporary,'data'),native);
          const file = path.join(workspace,'a');
          await fs.writeFile(file,'before\n',{mode:0o640});
          const start = await checkpoint.begin(workspace);
          assert.equal(start.status,'capturing');
          await fs.writeFile(file,'after\n'); await fs.chmod(file,0o600);
          await fs.writeFile(path.join(workspace,'new'),'created\n');
          const result = await checkpoint.finish(start,workspace);
          assert.equal(result.checkpoint.status,'ready');
          assert.equal(result.changes.length,2);
          await checkpoint.restore(start.id,workspace,'undo');
          assert.equal(await fs.readFile(file,'utf8'),'before\n');
          assert.equal((await fs.stat(file)).mode & 0o777,0o640);
          await assert.rejects(fs.readFile(path.join(workspace,'new')),{code:'ENOENT'});
          await new Checkpoints(path.join(temporary,'data'),native).restore(start.id,workspace,'redo');
          assert.equal(await fs.readFile(file,'utf8'),'after\n');
          assert.equal((await fs.stat(file)).mode & 0o777,0o600);
          const write = checkpoint.write.bind(checkpoint); let count = 0;
          checkpoint.write = async (...args) => { await write(...args); if (++count === 2) throw Error('injected write failure'); };
          await assert.rejects(checkpoint.restore(start.id,workspace,'undo'),/已保留操作前/);
          assert.equal(await fs.readFile(file,'utf8'),'after\n');
          assert.equal(await fs.readFile(path.join(workspace,'new'),'utf8'),'created\n');
          checkpoint.write = write;
          await fs.writeFile(file,'external');
          await assert.rejects(checkpoint.restore(start.id,workspace,'undo'),/发生变化/);
          assert.equal(await fs.readFile(path.join(workspace,'new'),'utf8'),'created\n');
          console.log('PASS: macOS checkpoint undo/redo, permissions, restart, rollback and external-edit conflict');
          const data = path.join(temporary,'review-data');
          const archive = new ConversationArchive(path.join(temporary,'archive'));
          const store = await new Store(data,native,{archive}).init();
          const app = new App({directory:path.join(temporary,'data'),native,store});
          const session = app.newSession({workspace,providerId:'local',permission:'auto'});
          session.messages.push({role:'assistant',text:'checkpoint fixture',runStats:result});
          const selection = {sessionId:session.id,workspace,message:0,checkpointId:start.id,relative:'a',open:false};
          await app.handle('review.remember',{value:selection});
          await app.close();
          const reopened = await new Store(data,native,{archive}).init();
          assert.deepEqual(reopened.state.reviewView,selection);
          const resumed = new App({directory:path.join(temporary,'data'),native,store:reopened});
          const reviewed = await resumed.handle('checkpoint.review',selection);
          assert.equal(reviewed.before,'before\n'); assert.equal(reviewed.after,'after\n');
          await assert.rejects(resumed.handle('checkpoint.review',{...selection,checkpointId:'replaced'}),/快照已变化/);
          await resumed.handle('review.remember',{value:null}); await resumed.close();
          assert.equal((await new Store(data,native,{archive}).init()).state.reviewView,null);
          console.log('PASS: macOS persisted task/file review selection, closed panel, checkpoint identity and clearing');
          await fs.rm(temporary,{recursive:true,force:true});
          NODE
      - run: npm run build:mac
      - name: Verify installer, native backend and encrypted data persistence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {execFileSync,spawn} from 'node:child_process';
          import {build} from 'esbuild';
          const root = process.env.GITHUB_WORKSPACE;
          const temporary = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, 'qqclaw-verify-'));
          const run = (exe, args, options={}) => execFileSync(exe, args, {encoding:'utf8',timeout:180000,...options});
          const image = path.join(root,'release/macos/QQClaw.dmg');
          run('/usr/bin/hdiutil',['verify',image]);
          const mount = path.join(temporary,'mounted');
          await fs.mkdir(mount);
          run('/usr/bin/hdiutil',['attach','-readonly','-nobrowse','-mountpoint',mount,image]);
          try {
            if (await fs.readlink(path.join(mount,'Applications')) !== '/Applications') throw new Error('Applications installation shortcut missing');
            if (!(await fs.readFile(path.join(mount,'安装说明.txt'),'utf8')).includes('Node.js 22.13+')) throw new Error('Installation instructions missing');
            run('/usr/bin/ditto',[path.join(mount,'QQClaw.app'),path.join(temporary,'QQClaw.app')]);
            console.log('PASS: DMG checksum, read-only mount and application installation copy');
          } finally { run('/usr/bin/hdiutil',['detach',mount]); }
          const app = path.join(temporary,'QQClaw.app');
          const binary = path.join(app,'Contents/MacOS/QQClaw');
          console.log(run('/usr/bin/lipo',[binary,'-archs']).trim());
          run('/usr/bin/codesign',['--verify','--deep','--strict',app]);
          const libraries = run('/usr/bin/otool',['-L',binary]);
          if (/\/opt\/homebrew\/|\/usr\/local\//.test(libraries)) throw new Error('Non-system runtime dependency found');
          const source = await fs.readFile(path.join(root,'native/macos/QQClaw.swift'),'utf8');
          const bootstrap = source.indexOf('@main struct QQClawMain');
          if (bootstrap < 0) throw new Error('Native entrypoint missing');
          const tabActions = await build({entryPoints:[path.join(root,'ui/panel-tab-actions.mjs')],bundle:true,write:false,format:'iife',globalName:'QQClawTabActions',target:'safari16.4'});
          const tabHTML = '<!doctype html><div class="work-tabs-bar"><div class="browser-tabs" data-owner="one">'+['A','B'].map(name=>'<div data-tab-key="file:'+name+'"><button role="tab" data-action="panel-select-tab" data-key="file:'+name+'">'+name+'</button></div>').join('')+'</div></div><script>'+tabActions.outputFiles[0].text.replaceAll('</script','<\\/script')+'</script><script>'+String.raw`
            (async()=>{
              const tabs=['A','B'].map(name=>({key:'file:'+name,kind:'file',file:name+'.txt'})),closed=[];let owner='one';
              const assert=(value,message)=>{if(!value)throw Error(message)};
              const actions=new QQClawTabActions.PanelTabActions({context:()=>({owner,tabs,selected:'file:A',tool:false,workspace:'/tmp',url:()=>''}),close:(from,values)=>closed.push({from,keys:values.map(t=>t.key)}),move:()=>{},copy:()=>{},reveal:()=>{},external:()=>{},changed:()=>{},error:error=>{window.__tabActionsDone=error.message}});
              const a=document.querySelector('[data-key="file:A"]'),b=document.querySelector('[data-key="file:B"]');
              a.focus();a.dispatchEvent(new KeyboardEvent('keydown',{key:'F10',shiftKey:true,bubbles:true}));
              assert(actions.menu?.querySelectorAll('button').length===5,'WebKit Shift+F10 did not open tab menu');
              assert(actions.menu.querySelectorAll('button:disabled').length===0,'WebKit menu enabled state wrong');
              actions.menu.querySelector('button').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
              assert(!actions.menu&&document.activeElement===a,'WebKit Escape/focus restoration failed');
              b.dispatchEvent(new MouseEvent('contextmenu',{clientX:20,clientY:30,bubbles:true}));
              assert(actions.menu?.querySelectorAll('button:disabled').length===1,'WebKit last-tab right-close gate failed');
              actions.menu.querySelectorAll('button')[1].click();await Promise.resolve();
              assert(closed.length===1&&closed[0].from==='one'&&closed[0].keys.join()==='file:A','WebKit batch close lost owner or target');
              b.dispatchEvent(new MouseEvent('contextmenu',{bubbles:true}));owner='two';actions.refresh();
              assert(!actions.menu&&closed.length===1,'WebKit old-owner menu remained actionable');
              window.__tabActionsDone='passed';
            })().catch(error=>{window.__tabActionsDone=error.message});
          `+'</script>';
          const tabHTML64=Buffer.from(tabHTML).toString('base64');
          // Only this temporary verifier replaces main. The shipped .app is unchanged.
          const main = String.raw`
          @main struct VerifyMain {
              @MainActor static func main() async {
                  launchBackendIfRequested()
                  signal(SIGPIPE, SIG_IGN)
                  let application = NSApplication.shared
                  application.setActivationPolicy(.accessory)
                  application.finishLaunching()
                  let env = ProcessInfo.processInfo.environment
                  let host = Host()
                  host.data = URL(fileURLWithPath: env["QQCLAW_DATA_DIR"]!)
                  host.resources = URL(fileURLWithPath: env["QQCLAW_VERIFY_RESOURCES"]!)
                  host.vault = Vault(directory: host.data)
                  host.quitting = true
                  do {
                      try FileManager.default.createDirectory(at: host.data, withIntermediateDirectories: true)
                      let status = try await host.handle("system.status", [:]) as! [String: Any]
                      guard status["nodeReady"] as? Bool == true else { throw failure("Node discovery failed") }
                      print("PASS: macOS Node discovery")
                      let link = try DesktopIntegration.url(["workspace": host.data.path])
                      guard URLComponents(url: link, resolvingAgainstBaseURL: false)?.queryItems?.first?.value == host.data.path else { throw failure("Desktop workspace URL encoding failed") }
                      let threadId = UUID().uuidString.lowercased()
                      guard try DesktopIntegration.url(["threadId": threadId]).absoluteString == "codex://threads/" + threadId else { throw failure("Desktop thread URL failed") }
                      do { _ = try DesktopIntegration.url(["threadId": "https://invalid"]); throw failure("Invalid thread accepted") }
                      catch let error as NSError { guard error.localizedDescription.contains("会话 ID 无效") else { throw error } }
                      print("PASS: Desktop URL encoding and invalid thread rejection")
                      host.web = WKWebView(frame: NSRect(x: 0, y: 0, width: 1000, height: 760))
                      host.web.loadHTMLString("<!doctype html><script>window.__menuReady=true</script>", baseURL: nil)
                      var menuPageReady = false
                      for _ in 0..<100 {
                          if (try? await host.web.evaluateJavaScript("window.__menuReady === true")) as? Bool == true { menuPageReady = true; break }
                          try await Task.sleep(nanoseconds: 50_000_000)
                      }
                      guard menuPageReady else { throw failure("Native menu test page did not load") }
                      host.makeMenu()
                      func menuCommand(_ name: String, _ menu: NSMenu? = NSApp.mainMenu) -> NSMenuItem? {
                          for item in menu?.items ?? [] {
                              if item.representedObject as? String == name { return item }
                              if let found = menuCommand(name,item.submenu) { return found }
                          }
                          return nil
                      }
                      guard let newChat = menuCommand("new-session"), let runtimeMenu = menuCommand("runtime"), let sidebarMenu = menuCommand("toggle-sidebar"), let panelMenu = menuCommand("toggle-panel"), let increaseMenu = menuCommand("font-increase") else { throw failure("Native application menu commands missing") }
                      _ = try await host.handle("window.menuState",["ready":false,"sidebar":true,"panel":false,"fontSize":14])
                      guard !host.validateMenuItem(newChat), host.validateMenuItem(runtimeMenu) else { throw failure("Native setup menu gate failed") }
                      _ = try await host.handle("window.menuState",["ready":true,"sidebar":true,"panel":false,"fontSize":20])
                      guard host.validateMenuItem(newChat), host.validateMenuItem(sidebarMenu), sidebarMenu.state == .on, host.validateMenuItem(panelMenu), panelMenu.state == .off, !host.validateMenuItem(increaseMenu) else { throw failure("Native menu enabled/check state failed") }
                      _ = try await host.web.evaluateJavaScript("window.__menuEvents=[];window.__qqclawReceive=value=>window.__menuEvents.push(value);true")
                      host.menuCommand(newChat)
                      let dispatched = try await host.web.evaluateJavaScript("JSON.stringify(window.__menuEvents)") as? String ?? ""
                      guard dispatched.contains("menu-action"), dispatched.contains("new-session") else { throw failure("Native menu action did not reach WebKit bridge") }
                      guard let searchMenu = menuCommand("search"), let findMenu = menuCommand("find-message"), searchMenu.keyEquivalent == "k", findMenu.keyEquivalent == "f", host.validateMenuItem(searchMenu), !host.validateMenuItem(findMenu) else { throw failure("Native search menu or no-session gate failed") }
                      _ = try await host.handle("window.menuState",["ready":true,"hasSession":true,"sidebar":true,"panel":false,"fontSize":14])
                      guard host.validateMenuItem(findMenu) else { throw failure("Native find menu did not enable for current session") }
                      host.menuCommand(searchMenu); host.menuCommand(findMenu)
                      let searchEvents = try await host.web.evaluateJavaScript("JSON.stringify(window.__menuEvents)") as? String ?? ""
                      guard searchEvents.contains("search"), searchEvents.contains("find-message") else { throw failure("Native search/find actions did not reach WebKit bridge") }
                      print("PASS: AppKit global search/current-chat find shortcuts, session gate and command dispatch")
                      print("PASS: AppKit file/view/help menus, setup gating, checked state, font limits and WebKit command dispatch")
                      host.web.loadHTMLString(String(decoding: Data(base64Encoded: "${tabHTML64}")!, as: UTF8.self), baseURL: nil)
                      var tabActionsResult = ""
                      for _ in 0..<100 {
                          tabActionsResult = (try? await host.web.evaluateJavaScript("window.__tabActionsDone || ''")) as? String ?? ""
                          if !tabActionsResult.isEmpty { break }
                          try await Task.sleep(nanoseconds: 50_000_000)
                      }
                      guard tabActionsResult == "passed" else { throw failure("WebKit tab-actions component: " + tabActionsResult) }
                      print("PASS: real WebKit tab-actions component keyboard/context menus, focus, disabled items and batch-close owner isolation (not full app GUI or trusted pointer gestures)")
                      let browserWindow = NSWindow(contentRect: host.web.frame, styleMask: [.titled], backing: .buffered, defer: false)
                      browserWindow.contentView = host.web; browserWindow.orderFront(nil)
                      host.window = browserWindow
                      _ = try await host.handle("window.theme", ["theme": "dark"])
                      guard browserWindow.appearance?.name == .darkAqua, host.web.appearance?.name == .darkAqua else { throw failure("Dark native appearance failed") }
                      _ = try await host.handle("window.theme", ["theme": "light"])
                      guard browserWindow.appearance?.name == .aqua, host.web.appearance?.name == .aqua else { throw failure("Light native appearance failed") }
                      print("PASS: native window and WKWebView monochrome appearance switching")
                      let browser = BrowserHost(resources: host.resources, parent: host.web, data: host.data.appendingPathComponent("download-verification")) { _ in }
                      let owner = UUID().uuidString.lowercased()
                      browser.setView(["owner": owner, "visible": true, "x": 0, "y": 0, "width": 1000, "height": 760, "viewportWidth": 1000, "viewportHeight": 760])
                      let fixture = env["QQCLAW_BROWSER_FIXTURE_URL"]!
                      func control(_ action: String, _ values: [String: Any] = [:]) async throws -> Any {
                          try await browser.handle(values.merging(["action": action, "owner": owner, "profile": String(repeating: "a", count: 32)]) { _, value in value })
                      }
                      let page = try await control("open", ["url": fixture]) as! [String: Any]
                      guard page["title"] as? String == "QQClaw Browser Check", let elements = page["elements"] as? [[String: Any]], let ref = elements.first(where: { $0["role"] as? String == "input" })?["ref"] as? String else { throw failure("Native browser snapshot failed") }
                      _ = try await control("fill", ["ref": ref, "text": "native-mac-search"])
                      _ = try await control("press", ["ref": ref, "key": "Enter"])
                      var found = false
                      for _ in 0..<40 {
                          let result = try await control("snapshot") as! [String: Any]
                          if (result["text"] as? String ?? "").contains("Search received: native-mac-search") { found = true; break }
                          try await Task.sleep(nanoseconds: 100_000_000)
                      }
                      guard found else { throw failure("Native browser form submission failed") }
                      let screenshot = try await control("screenshot") as! [String: Any]
                      guard let encoded = screenshot["imageBase64"] as? String, let png = Data(base64Encoded: encoded), png.count > 100 else { throw failure("Native browser screenshot failed") }
                      let browsing = browser.history.state()["items"] as! [[String: Any]]
                      guard browsing.count == 2, browsing.contains(where: { $0["url"] as? String == fixture && $0["title"] as? String == "QQClaw Browser Check" }), browsing[0]["title"] as? String == "Search Result" else { throw failure("Successful top-level navigation history not recorded") }
                      _ = try await control("open", ["url": fixture + "#section"])
                      let revisited = browser.history.state()["items"] as! [[String: Any]]
                      guard revisited.count == 2, revisited[0]["url"] as? String == fixture else { throw failure("History did not deduplicate fragment/revisit") }
                      let historyDirectory = host.data.appendingPathComponent("download-verification")
                      let historyFile = historyDirectory.appendingPathComponent("browser-history.json")
                      let encryptedHistory = try String(contentsOf: historyFile, encoding: .utf8)
                      guard !encryptedHistory.contains("QQClaw Browser Check"), !encryptedHistory.contains(fixture) else { throw failure("Browsing history leaked cleartext") }
                      let reloadedHistory = BrowserHistory(directory: historyDirectory) { _ in }
                      guard (reloadedHistory.state()["items"] as? [[String: Any]])?.count == 2 else { throw failure("Encrypted browsing history reload failed") }
                      _ = try browser.history.handle(["action": "remove", "id": revisited[0]["id"]!])
                      guard (browser.history.state()["items"] as? [[String: Any]])?.count == 1 else { throw failure("History remove did not persist") }
                      print("PASS: real WebKit navigation history, final URL/title, revisit deduplication, encrypted reload and deletion")
                      let historyChecks = host.data.appendingPathComponent("browsing-history-checks")
                      try FileManager.default.createDirectory(at: historyChecks, withIntermediateDirectories: true)
                      let historyVault = Vault(directory: historyChecks), historyCheckFile = historyChecks.appendingPathComponent("browser-history.json")
                      let timestamp = Int64(Date().timeIntervalSince1970 * 1000)
                      let samples: [[String: Any]] = [0, 7_200_000, 172_800_000].enumerated().map { index, age in ["id": UUID().uuidString.lowercased(), "url": fixture + "age-" + String(index), "title": "Range sample", "at": timestamp - Int64(age)] }
                      let sampleText = String(decoding: try JSONSerialization.data(withJSONObject: samples), as: UTF8.self)
                      try Data(try historyVault.handle("vault.encrypt", sampleText).utf8).write(to: historyCheckFile, options: .atomic)
                      let ranges = BrowserHistory(directory: historyChecks) { _ in }
                      guard (try ranges.handle(["action": "clear", "range": "hour"])["items"] as? [[String: Any]])?.count == 2,
                            (try ranges.handle(["action": "clear", "range": "day"])["items"] as? [[String: Any]])?.count == 1,
                            (try ranges.handle(["action": "clear", "range": "all"])["items"] as? [[String: Any]])?.isEmpty == true else { throw failure("History clear ranges incorrect") }
                      let many: [[String: Any]] = (0..<500).map { index in ["id": UUID().uuidString.lowercased(), "url": fixture + "page-" + String(index), "title": "History sample", "at": timestamp - Int64(index * 1000)] }
                      let manyText = String(decoding: try JSONSerialization.data(withJSONObject: many), as: UTF8.self)
                      try Data(try historyVault.handle("vault.encrypt", manyText).utf8).write(to: historyCheckFile, options: .atomic)
                      let bounded = BrowserHistory(directory: historyChecks) { _ in }; bounded.visit(fixture + "newest", title: "Newest")
                      let boundedItems = bounded.state()["items"] as! [[String: Any]]
                      guard boundedItems.count == 500, boundedItems[0]["title"] as? String == "Newest", !boundedItems.contains(where: { $0["url"] as? String == fixture + "page-499" }) else { throw failure("History bound/order incorrect") }
                      try Data("corrupt-history".utf8).write(to: historyCheckFile, options: .atomic)
                      let corruptHistory = BrowserHistory(directory: historyChecks) { _ in }; corruptHistory.visit(fixture, title: "Must not overwrite")
                      guard !(corruptHistory.state()["storageError"] as? String ?? "").isEmpty, try String(contentsOf: historyCheckFile, encoding: .utf8) == "corrupt-history" else { throw failure("Corrupt history silently replaced") }
                      print("PASS: browsing history hour/day/all ranges, 500-URL bound and corrupt-file preservation (isolated fixtures)")
                      guard !BrowserHost.allowed("file:///etc/passwd"), !BrowserHost.allowed("https://qqclaw.local") else { throw failure("Browser accepted forbidden URL") }
                      let tabState = try await control("newTab") as! [String: Any]
                      guard (tabState["tabs"] as? [[String: Any]])?.count == 2 else { throw failure("Browser tab creation failed") }
                      let single = try await control("closeTab", ["tabId": tabState["activeTab"]!]) as! [String: Any]
                      guard (single["tabs"] as? [[String: Any]])?.count == 1 else { throw failure("Closing background tab failed") }
                      let empty = try await control("closeTab", ["tabId": single["activeTab"]!]) as! [String: Any]
                      guard (empty["tabs"] as? [[String: Any]])?.isEmpty == true, empty["activeTab"] as? String == "" else { throw failure("Last tab was recreated") }
                      let stillEmpty = try await control("state") as! [String: Any]
                      guard (stillEmpty["tabs"] as? [[String: Any]])?.isEmpty == true else { throw failure("Reading state created a ghost tab") }
                      guard let closedRevision = empty["revision"] as? Int64,
                            let currentRevision = stillEmpty["revision"] as? Int64,
                            currentRevision > closedRevision else { throw failure("Browser state revision did not increase") }
                      func downloadItems() -> [[String: Any]] { browser.downloads.state()["items"] as! [[String: Any]] }
                      func awaitDownload(_ url: String, _ status: String) async throws -> [String: Any] {
                          for _ in 0..<250 {
                              if let item = downloadItems().first(where: { $0["url"] as? String == url && $0["status"] as? String == status }) { return item }
                              try await Task.sleep(nanoseconds: 100_000_000)
                          }
                          throw failure("Download did not reach " + status + ": " + url + " " + String(describing: downloadItems()))
                      }
                      let downloadURL = fixture + "download"
                      let downloadResult = try await control("open", ["url": downloadURL]) as! [String: Any]
                      guard downloadResult["downloadStarted"] as? Bool == true else { throw failure("Download navigation was treated as a webpage") }
                      let completedDownload = try await awaitDownload(downloadURL, "completed")
                      let actualFile = try Data(contentsOf: URL(fileURLWithPath: completedDownload["path"] as! String))
                      let expectedFile = Data(repeating: 65, count: 524288)
                      guard actualFile == expectedFile else { throw failure("WKDownload file bytes differ") }
                      print("PASS: native WKDownload attachment navigation, actual destination and complete file bytes")
                      let slowURL = fixture + "slow-download"
                      _ = try await control("open", ["url": slowURL])
                      _ = try await awaitDownload(slowURL, "running")
                      let duringDownload = try await control("state") as! [String: Any]
                      _ = try await control("closeTab", ["tabId": duringDownload["activeTab"]!])
                      let closedDuringDownload = try await control("state") as! [String: Any]
                      guard (closedDuringDownload["tabs"] as! [[String: Any]]).isEmpty else { throw failure("Closing download source left a ghost tab") }
                      let slowCompleted = try await awaitDownload(slowURL, "completed")
                      guard try Data(contentsOf: URL(fileURLWithPath: slowCompleted["path"] as! String)) == Data(repeating: 65, count: 2097152) else { throw failure("Closing tab truncated WKDownload") }
                      print("PASS: actual WKDownload continues to complete after closing its last source tab")
                      let cancelURL = fixture + "cancel-download"
                      _ = try await control("open", ["url": cancelURL])
                      let cancelDownload = try await awaitDownload(cancelURL, "running")
                      _ = try browser.downloads.handle(["action": "cancel", "id": cancelDownload["id"]!])
                      _ = try await awaitDownload(cancelURL, "cancelled")
                      let restoredDownloads = BrowserDownloads(directory: host.data.appendingPathComponent("download-verification")) { _ in }
                      let restoredItems = restoredDownloads.state()["items"] as! [[String: Any]]
                      guard restoredItems.count == 3, restoredItems.contains(where: { $0["status"] as? String == "cancelled" }) else { throw failure("Encrypted download history did not reload") }
                      let encryptedDownloads = try String(contentsOf: host.data.appendingPathComponent("download-verification/browser-downloads.json"), encoding: .utf8)
                      guard encryptedDownloads.hasPrefix("mac1:"), !encryptedDownloads.contains(downloadURL) else { throw failure("Download history was not encrypted") }
                      _ = try browser.downloads.handle(["action": "clear"])
                      guard downloadItems().isEmpty, FileManager.default.fileExists(atPath: completedDownload["path"] as! String) else { throw failure("Clearing records removed files") }
                      print("PASS: WKDownload cancellation, Keychain-encrypted history reload and clear without file deletion")
                      let heldURL = fixture + "held-download"
                      _ = try await control("open", ["url": heldURL])
                      let held = try await awaitDownload(heldURL, "running")
                      for _ in 0..<50 {
                          if downloadItems().contains(where: { $0["id"] as? String == held["id"] as? String && !($0["path"] as? String ?? "").isEmpty }) { break }
                          try await Task.sleep(nanoseconds: 100_000_000)
                      }
                      let historyURL = host.data.appendingPathComponent("download-verification/browser-downloads.json")
                      let savedHistoryURL = historyURL.appendingPathExtension("preserved")
                      try FileManager.default.moveItem(at: historyURL, to: savedHistoryURL)
                      try FileManager.default.createDirectory(at: historyURL, withIntermediateDirectories: false)
