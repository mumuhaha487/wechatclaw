name: Inspect original macOS browser runtime
on:
  workflow_dispatch:
  push:
    branches: [work/official-browser-integration]
    paths:
      - scripts/macos-official-runtime.mjs
      - .github/workflows/macos-runtime.yml
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect signed app resources without installing
        run: node scripts/macos-official-runtime.mjs --download --output "$RUNNER_TEMP/qqclaw-mac-official"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-official-runtime-inventory
          path: |
            ${{ runner.temp }}/qqclaw-mac-official/*.json
            ${{ runner.temp }}/qqclaw-mac-official/app-signature.txt
            ${{ runner.temp }}/qqclaw-mac-official/app-main.js
          if-no-files-found: warn
          retention-days: 7
