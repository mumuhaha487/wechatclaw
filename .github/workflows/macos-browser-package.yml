name: Package universal Mac app with the verified official browser
on:
  workflow_dispatch:
  push:
    branches: [work/official-browser-integration]
    paths:
      - .github/workflows/macos-browser-package.yml
      - scripts/build-macos.mjs
      - native/macos/QQClaw.swift
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm the recorded production integration checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/41370219810';
          const run=await fetch(base,{headers}).then(r=>{if(!r.ok)throw Error('Validation run HTTP '+r.status);return r.json()});
          if(run.head_sha!=='1cfe2bd5cea6e826deace47c89b8bc378b998d9e')throw Error('Validation source mismatch');
          const jobs=await fetch(base+'/jobs',{headers}).then(r=>r.json());
          const required=['Control an embedded native tab through the original extension','Verify independent official extension profiles','Run the product Swift Host with the packaged frontend and real empty backend'];
          for(const name of required)if(!jobs.jobs?.some(job=>job.steps?.some(step=>step.name===name&&step.conclusion==='success')))throw Error('Recorded check did not pass: '+name);
          await fs.mkdir(path.join(process.env.RUNNER_TEMP,'candidate'),{recursive:true});
          await fs.writeFile(path.join(process.env.RUNNER_TEMP,'candidate/validation-source.json'),JSON.stringify({validationRun:run.id,validationHead:run.head_sha,packageHead:process.env.GITHUB_SHA,checks:required,scope:'Recorded real official API and product Host checks, followed by a universal package build. Intel automatic browsing, physical GUI and WeChat are not claimed.'},null,2));
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: mac-official-runtime-inventory
          run-id: 41353878675
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/official-runtime
      - uses: actions/cache/restore@v4
        id: cef
        with:
          path: |
            ${{ runner.temp }}/browser-build/build/qqclaw-macos/Release/QQClawBrowser.app
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          key: mac-cef-26-arm64-${{ hashFiles('native/cef/macos/**', 'scripts/build-macos-browser.mjs') }}
          fail-on-cache-miss: true
      - name: Build and verify both application architectures and the disk image
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';import {buildMac} from './scripts/build-macos.mjs';
          await buildMac(process.cwd(),{browserBuild:path.join(process.env.RUNNER_TEMP,'browser-build/mac-browser-build.json'),runtimeCache:path.join(process.env.RUNNER_TEMP,'official-runtime'),output:path.join(process.env.RUNNER_TEMP,'candidate/QQClaw.dmg')});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal-browser-package
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 7
