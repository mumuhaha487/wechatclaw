name: Connect original macOS browser extension
on:
  workflow_dispatch:
  push:
    branches: [work/official-browser-integration]
    paths:
      - backend/macos-browser-transport.mjs
      - backend/macos-official-runtime.mjs
      - scripts/macos-official-mcp.mjs
      - scripts/check-macos-official-browser.mjs
      - scripts/macos-browser-runtime.mjs
      - native/cef/macos/**
      - .github/workflows/macos-official-browser.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-official-browser-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the production Swift runtime adapter
        run: xcrun swiftc -swift-version 5 -parse-as-library -typecheck native/macos/QQClaw.swift native/macos/BrowserHost.swift native/macos/CefRuntime.swift
      - name: Package the product MCP entry
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {bundleMacOfficialMcp} from './scripts/macos-browser-runtime.mjs';
          await bundleMacOfficialMcp(process.cwd(),path.join(process.env.RUNNER_TEMP,'mcp-product'));
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: mac-official-runtime-inventory
          run-id: 41353878675
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/official-runtime
      - name: Unpack and verify the complete original runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';
          import {unpackMacBrowserRuntime} from './scripts/macos-browser-runtime.mjs';
          const root=path.join(process.env.RUNNER_TEMP,'official-runtime');
          await unpackMacBrowserRuntime({cache:root,destination:path.join(root,'runtime')});
          NODE
      - uses: actions/cache/restore@v4
        id: cef
        with:
          path: |
            ${{ runner.temp }}/browser-build/build/qqclaw-macos/Release/QQClawBrowser.app
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          key: mac-cef-26-arm64-${{ hashFiles('native/cef/macos/**', 'scripts/build-macos-browser.mjs') }}
      - name: Compile sandboxed CEF Chrome Views component
        if: steps.cef.outputs.cache-hit != 'true'
        run: node scripts/build-macos-browser.mjs --entry native/cef/macos/OfficialCheck.mm --output "$RUNNER_TEMP/browser-build"
      - uses: actions/cache/save@v4
        if: steps.cef.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/browser-build/build/qqclaw-macos/Release/QQClawBrowser.app
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          key: ${{ steps.cef.outputs.cache-primary-key }}
      - name: Control an embedded native tab through the original extension
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {spawn} from 'node:child_process';
          const root=path.join(process.env.RUNNER_TEMP,'official-runtime');
          const manifest=JSON.parse(await fs.readFile(path.join(root,'runtime/runtime.json'),'utf8'));
          const cli=path.join(root,'runtime',manifest.paths.codexCliPath);
          const child=spawn(process.execPath,['scripts/check-macos-official-browser.mjs','--output',path.join(process.env.RUNNER_TEMP,'official-browser-proof'),'--runtime',path.join(root,'runtime'),'--cli',cli,'--build',path.join(process.env.RUNNER_TEMP,'browser-build'),'--mcp-entry',path.join(process.env.RUNNER_TEMP,'mcp-product/macos-official-mcp.cjs'),'--tab-mode','claim'],{stdio:'inherit'});
          const code=await new Promise(resolve=>child.on('exit',resolve));if(code!==0)throw Error('Official browser component check failed');
          NODE
      - name: Run the product Swift Host with the packaged frontend and real empty backend
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {execFile} from 'node:child_process';import {promisify} from 'node:util';
          import {macPayload} from './scripts/build-macos.mjs';
          const run=promisify(execFile),root=process.cwd(),base=path.join(process.env.RUNNER_TEMP,'host-preview');
          const proof=path.join(process.env.RUNNER_TEMP,'official-browser-proof');await fs.mkdir(base,{recursive:true});
          const built=JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP,'browser-build/mac-browser-build.json'),'utf8'));
          const app=path.join(base,'QQClaw.app');await run('/usr/bin/ditto',[built.app,app]);
          const resources=path.join(app,'Contents/Resources'),binary=path.join(app,'Contents/MacOS/QQClaw');
          await macPayload(root,resources);
          const original=path.join(process.env.RUNNER_TEMP,'official-runtime/runtime');
          const manifest=JSON.parse(await fs.readFile(path.join(original,'runtime.json'),'utf8'));
          const node=path.join(resources,'node/arm64/bin/node');await fs.mkdir(path.dirname(node),{recursive:true});
          await fs.copyFile(path.join(original,manifest.paths.nodePath),node);await fs.chmod(node,0o755);
          const plist=(await fs.readFile('native/macos/Info.plist','utf8')).replaceAll('__VERSION__',JSON.parse(await fs.readFile('package.json','utf8')).version);
          await fs.writeFile(path.join(app,'Contents/Info.plist'),plist);
          const source=await fs.readFile('native/macos/QQClaw.swift','utf8'),offset=source.indexOf('@main struct QQClawMain');if(offset<0)throw Error('Host entry missing');
          const main=String.raw`
          @main struct HostPreview {
            @MainActor static func main() {
              launchBackendIfRequested(); signal(SIGPIPE,SIG_IGN)
              let host=Host(); var errorText="",checking=false
              do {
                try host.prepareEnvironment()
                let runtime=try MacCefRuntime(frameworks:Bundle.main.privateFrameworksURL!)
                host.cef=runtime
                runtime.onEvent={ value in
                  host.cefEvent(value)
                  if value["event"] as? String == "root-created", !checking {
                    checking=true
                    Task { @MainActor in
                      do {
                        var ready=false
                        for _ in 0..<300 {
                          if let web=host.web, (try? await web.evaluateJavaScript("document.readyState==='complete' && document.querySelector('#app').children.length>0")) as? Bool == true { ready=true;break }
                          try await Task.sleep(nanoseconds:100_000_000)
                        }
                        guard ready,host.window === runtime.window,host.web.window === runtime.window else { throw failure("The product frontend did not load in the CEF root") }
                        let backend=try await host.startBackend()
                        let snapshot=try await host.call(backend,"snapshot") as! [String:Any]
                        guard let accounts=snapshot["accounts"] as? [Any],accounts.isEmpty else { throw failure("The isolated Host did not have an empty account store") }
                        _=try await host.call(backend,"settings.save",params:["fontSize":15])
                        let image: NSImage = try await withCheckedThrowingContinuation { continuation in
                          host.web.takeSnapshot(with:nil) { image,error in
                            if let image { continuation.resume(returning:image) }
                            else { continuation.resume(throwing:error ?? failure("The product frontend snapshot failed")) }
                          }
                        }
                        guard let tiff=image.tiffRepresentation,let bitmap=NSBitmapImageRep(data:tiff),let png=bitmap.representation(using:.png,properties:[:]) else { throw failure("The product frontend screenshot failed") }
                        try png.write(to:URL(fileURLWithPath:ProcessInfo.processInfo.environment["QQCLAW_HOST_IMAGE"]!))
                        host.requestCefQuit()
                      } catch { errorText=error.localizedDescription;host.backend?.killGroup();runtime.close() }
                    }
                  }
                }
                try runtime.start(options:["profile":host.data.appendingPathComponent("browser-profiles").path,"helperPath":Bundle.main.privateFrameworksURL!.appendingPathComponent("QQClawBrowser Helper.app/Contents/MacOS/QQClawBrowser Helper").path])
                NSApp.delegate=host
                DispatchQueue.main.asyncAfter(deadline:.now()+45) { if !host.allowQuit { errorText="Product Host verification timed out";host.backend?.killGroup();runtime.close() } }
                runtime.run()
                if errorText.isEmpty {
                  guard host.allowQuit else { throw failure("The product quit path did not acknowledge saved data") }
                  let disk=try JSONSerialization.jsonObject(with:Data(contentsOf:host.data.appendingPathComponent("state.json"))) as! [String:Any]
                  let plain=try host.vault.handle("vault.decrypt",disk["protected"] as! String)
                  let saved=try JSONSerialization.jsonObject(with:Data(plain.utf8)) as! [String:Any]
                  guard (saved["settings"] as? [String:Any])?["fontSize"] as? Int == 15 else { throw failure("The real backend setting was not persisted") }
                }
                host.applicationWillTerminate(Notification(name:NSApplication.willTerminateNotification))
              } catch { errorText=error.localizedDescription }
              let record:[String:Any]=["passed":errorText.isEmpty,"error":errorText,"scope":"Actual product Swift Host with CEF root, packaged frontend, real empty backend, encrypted setting save and acknowledged quit; no model, WeChat, physical input or final installer."]
              try? jsonData(record).write(to:URL(fileURLWithPath:ProcessInfo.processInfo.environment["QQCLAW_HOST_RESULT"]!))
              if !errorText.isEmpty { fputs(errorText+"\n",stderr);exit(1) }
            }
          }
          `;
          const verifier=path.join(base,'HostPreview.swift');await fs.writeFile(verifier,source.slice(0,offset)+main);
          await run('/usr/bin/xcrun',['swiftc','-swift-version','5','-parse-as-library','-O','-framework','AppKit','-framework','WebKit','-framework','Security','-framework','CryptoKit',verifier,path.join(root,'native/macos/BrowserHost.swift'),path.join(root,'native/macos/CefRuntime.swift'),'-o',binary],{maxBuffer:4*1024*1024});
          await run('/usr/bin/codesign',['--force','--sign','-',app]);
          try {const result=await run(binary,[],{env:{...process.env,QQCLAW_DATA_DIR:path.join(base,'data'),CODEX_HOME:path.join(base,'codex'),QQCLAW_HOST_IMAGE:path.join(proof,'host-preview.png'),QQCLAW_HOST_RESULT:path.join(proof,'host-preview.json')},timeout:60000,maxBuffer:2*1024*1024});await fs.writeFile(path.join(proof,'host-preview.log'),result.stdout+result.stderr);}
          catch(error){await fs.writeFile(path.join(proof,'host-preview.log'),(error.stdout||'')+(error.stderr||'')+'\n'+error.message);throw error;}
          NODE
      - name: Preserve crash diagnostics from the owned native components
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import os from 'node:os';
          const reports=path.join(os.homedir(),'Library/Logs/DiagnosticReports');
          const output=path.join(process.env.RUNNER_TEMP,'official-browser-proof');await fs.mkdir(output,{recursive:true});
          for(const name of await fs.readdir(reports).catch(()=>[]))if(/^QQClaw(?:Browser)?[-_].*\.ips$/.test(name))await fs.copyFile(path.join(reports,name),path.join(output,name));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-official-browser-evidence
          path: |
            ${{ runner.temp }}/official-browser-proof/*.ips
            ${{ runner.temp }}/official-browser-proof/*.json
            ${{ runner.temp }}/official-browser-proof/*.log
            ${{ runner.temp }}/official-browser-proof/*.png
            ${{ runner.temp }}/official-browser-proof/*.jpg
            ${{ runner.temp }}/official-browser-proof/profile/cef.log
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          if-no-files-found: warn
          retention-days: 7
