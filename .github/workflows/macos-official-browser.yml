name: Connect original macOS browser extension
on:
  workflow_dispatch:
  push:
    branches: [work/official-browser-integration]
    paths:
      - backend/macos-browser-identity.mjs
      - backend/macos-browser-transport.mjs
      - backend/macos-official-runtime.mjs
      - scripts/macos-official-mcp.mjs
      - scripts/check-macos-official-browser.mjs
      - scripts/macos-browser-runtime.mjs
      - native/cef/macos/**
      - .github/workflows/macos-official-browser.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mac-official-browser-check
  cancel-in-progress: true
jobs:
  browser:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare an unlocked disposable CI keychain for native encrypted storage
        run: |
          node --input-type=module <<'NODE'
          import {execFile} from 'node:child_process';import {promisify} from 'node:util';import {randomBytes} from 'node:crypto';import path from 'node:path';
          const run=promisify(execFile),keychain=path.join(process.env.RUNNER_TEMP,'qqclaw-native-check.keychain-db'),password=randomBytes(32).toString('hex');
          await run('/usr/bin/security',['create-keychain','-p',password,keychain]);
          await run('/usr/bin/security',['set-keychain-settings','-lut','7200',keychain]);
          await run('/usr/bin/security',['unlock-keychain','-p',password,keychain]);
          await run('/usr/bin/security',['default-keychain','-d','user','-s',keychain]);
          await run('/usr/bin/security',['list-keychains','-d','user','-s',keychain]);
          console.log('Using a real encrypted disposable keychain in this ephemeral CI runner.');
          NODE
      - name: Typecheck the production Swift runtime adapter
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const source=await fs.readFile('native/macos/QQClaw.swift','utf8'),workflow=await fs.readFile('.github/workflows/macos-official-browser.yml','utf8');
          const marker='const main=String.raw'+String.fromCharCode(96),start=workflow.indexOf(marker)+marker.length,end=workflow.indexOf('\n          '+String.fromCharCode(96)+';',start);
          if(start<marker.length||end<0)throw Error('Native check entry not found');
          const file=path.join(process.env.RUNNER_TEMP,'HostTypecheck.swift');await fs.writeFile(file,source.slice(0,source.indexOf('@main struct QQClawMain'))+workflow.slice(start,end));
          execFileSync('/usr/bin/xcrun',['swiftc','-swift-version','5','-parse-as-library','-typecheck',file,'native/macos/BrowserHost.swift','native/macos/CefRuntime.swift'],{stdio:'inherit'});
          NODE
      - name: Package the product MCP entry
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {bundleMacOfficialMcp} from './scripts/macos-browser-runtime.mjs';
          await bundleMacOfficialMcp(process.cwd(),path.join(process.env.RUNNER_TEMP,'mcp-product'));
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: mac-official-runtime-inventory
          run-id: 41353878675
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/official-runtime
      - name: Unpack and verify the complete original runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';
          import {unpackMacBrowserRuntime} from './scripts/macos-browser-runtime.mjs';
          const root=path.join(process.env.RUNNER_TEMP,'official-runtime');
          await unpackMacBrowserRuntime({cache:root,destination:path.join(root,'runtime')});
          NODE
      - uses: actions/cache/restore@v4
        id: cef
        with:
          path: |
            ${{ runner.temp }}/browser-build/build/qqclaw-macos/Release/QQClawBrowser.app
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          key: mac-cef-26-arm64-${{ hashFiles('native/cef/macos/**', 'scripts/build-macos-browser.mjs') }}
      - name: Compile sandboxed CEF Chrome Views component
        if: steps.cef.outputs.cache-hit != 'true'
        run: node scripts/build-macos-browser.mjs --entry native/cef/macos/OfficialCheck.mm --output "$RUNNER_TEMP/browser-build"
      - uses: actions/cache/save@v4
        if: steps.cef.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/browser-build/build/qqclaw-macos/Release/QQClawBrowser.app
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          key: ${{ steps.cef.outputs.cache-primary-key }}
      - name: Control an embedded native tab through the original extension
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {spawn} from 'node:child_process';
          const root=path.join(process.env.RUNNER_TEMP,'official-runtime');
          const manifest=JSON.parse(await fs.readFile(path.join(root,'runtime/runtime.json'),'utf8'));
          const cli=path.join(root,'runtime',manifest.paths.codexCliPath);
          const child=spawn(process.execPath,['scripts/check-macos-official-browser.mjs','--output',path.join(process.env.RUNNER_TEMP,'official-browser-proof'),'--runtime',path.join(root,'runtime'),'--cli',cli,'--build',path.join(process.env.RUNNER_TEMP,'browser-build'),'--mcp-entry',path.join(process.env.RUNNER_TEMP,'mcp-product/macos-official-mcp.cjs'),'--tab-mode','claim'],{stdio:'inherit'});
          const code=await new Promise(resolve=>child.on('exit',resolve));if(code!==0)throw Error('Official browser component check failed');
          NODE
      - name: Verify independent official extension profiles
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import {spawn} from 'node:child_process';
          const root=path.join(process.env.RUNNER_TEMP,'official-runtime');
          const manifest=JSON.parse(await fs.readFile(path.join(root,'runtime/runtime.json'),'utf8'));
          const cli=path.join(root,'runtime',manifest.paths.codexCliPath);
          const child=spawn(process.execPath,['scripts/check-macos-official-browser.mjs','--output',path.join(process.env.RUNNER_TEMP,'official-browser-profiles'),'--runtime',path.join(root,'runtime'),'--cli',cli,'--build',path.join(process.env.RUNNER_TEMP,'browser-build'),'--mcp-entry',path.join(process.env.RUNNER_TEMP,'mcp-product/macos-official-mcp.cjs'),'--tab-mode','claim','--profile-isolation'],{stdio:'inherit'});
          const code=await new Promise(resolve=>child.on('exit',resolve));if(code!==0)throw Error('Official browser component check failed');
          NODE
      - name: Run the product Swift Host with the packaged frontend and real empty backend
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import http from 'node:http';import {execFile} from 'node:child_process';import {promisify} from 'node:util';
          import {macPayload} from './scripts/build-macos.mjs';
          import {bundleMacNode} from './scripts/macos-node-runtime.mjs';
          import {prepareOfficialBrowser,discoverOfficialBrowser} from './backend/official-browser.mjs';
          import {openMacOfficialRuntime} from './backend/macos-official-runtime.mjs';
          import {BrowserAccessHost} from './backend/browser-access.mjs';
          import {elicitationForm,simpleConsent,validateForm} from './backend/codex-approvals.mjs';
          import {randomUUID} from 'node:crypto';
          const run=promisify(execFile),root=process.cwd(),base=path.join(process.env.RUNNER_TEMP,'host-preview');
          const proof=path.join(process.env.RUNNER_TEMP,'official-browser-proof');await fs.mkdir(base,{recursive:true});
          const built=JSON.parse(await fs.readFile(path.join(process.env.RUNNER_TEMP,'browser-build/mac-browser-build.json'),'utf8'));
          const app=path.join(base,'QQClaw.app');await run('/usr/bin/ditto',[built.app,app]);
          await fs.unlink(path.join(app,'Contents/MacOS/QQClawBrowser'));
          const resources=path.join(app,'Contents/Resources'),binary=path.join(app,'Contents/MacOS/QQClaw');
          await macPayload(root,resources);
          await bundleMacNode(root,resources);
          await run('/usr/bin/ditto',[path.join(process.env.RUNNER_TEMP,'official-runtime/runtime'),path.join(resources,'official-browser/arm64')]);
          const plist=(await fs.readFile('native/macos/Info.plist','utf8')).replaceAll('__VERSION__',JSON.parse(await fs.readFile('package.json','utf8')).version);
          await fs.writeFile(path.join(app,'Contents/Info.plist'),plist);
          const source=await fs.readFile('native/macos/QQClaw.swift','utf8'),offset=source.indexOf('@main struct QQClawMain');if(offset<0)throw Error('Host entry missing');
          const main=String.raw`
          @main struct HostPreview {
            @MainActor static func main() {
              launchBackendIfRequested(); signal(SIGPIPE,SIG_IGN); setbuf(stdout,nil);print("HOST_BEGIN")
              func signingStatus() -> OSStatus { var code:SecCode?;let status=SecCodeCopySelf(SecCSFlags(rawValue:0),&code);return status == errSecSuccess ? SecCodeCheckValidity(code!,SecCSFlags(rawValue:0),nil) : status }
              print("HOST_SIGNING_BEFORE_CEF " + String(signingStatus()))
              let host=Host(); var errorText="",checking=false
              do {
                try host.prepareEnvironment()
                let runtime=try MacCefRuntime(frameworks:Bundle.main.privateFrameworksURL!)
                host.cef=runtime
                runtime.onEvent={ value in
                  print("HOST_EVENT " + (value["event"] as? String ?? "unknown"));host.cefEvent(value)
                  if value["event"] as? String == "root-created" { print("HOST_SIGNING_AFTER_CEF " + String(signingStatus())) }
                  if value["event"] as? String == "root-created", !checking {
                    checking=true
                    Task { @MainActor in
                      do {
                        print("HOST_WAIT_FRONTEND");var ready=false
                        for _ in 0..<300 {
                          if let web=host.web, (try? await web.evaluateJavaScript("document.readyState==='complete' && document.querySelector('#app').children.length>0")) as? Bool == true { ready=true;break }
                          try await Task.sleep(nanoseconds:100_000_000)
                        }
                        guard ready,host.window === runtime.window,host.web.window === runtime.window else { throw failure("The product frontend did not load in the CEF root") }
                        print("HOST_FRONTEND_READY");let backend=try await host.startBackend()
                        let snapshot=try await host.call(backend,"snapshot") as! [String:Any]
                        guard let accounts=snapshot["accounts"] as? [Any],accounts.isEmpty else { throw failure("The isolated Host did not have an empty account store") }
                        _=try await host.call(backend,"settings.save",params:["fontSize":15])
                        let owner=UUID().uuidString.lowercased(),fixture=ProcessInfo.processInfo.environment["QQCLAW_HOST_FIXTURE"]!
                        func control(_ action:String,_ params:[String:Any]=[:]) async throws -> [String:Any] {
                          var request=params;request["action"]=action;request["owner"]=owner
                          guard let result=try await host.handle("browser.control",request) as? [String:Any] else { throw failure("Native browser returned no state") };return result
                        }
                        _=try await control("state")
                        _=try await control("open",["url":fixture])
                        var page:[String:Any]=[:]
                        for _ in 0..<200 {
                          page=try await control("state")
                          if page["title"] as? String == "QQClaw Host browser fixture",page["loading"] as? Bool == false { break }
                          try await Task.sleep(nanoseconds:100_000_000)
                        }
                        guard page["title"] as? String == "QQClaw Host browser fixture",let tab=page["activeTab"] as? String,
                          let tabs=page["tabs"] as? [[String:Any]],let revision=tabs.first(where:{$0["id"] as? String == tab})?["navigationRevision"] as? String else { throw failure("The product browser did not load its own fixture") }
                        _=try await host.handle("browser.view",["owner":owner,"visible":true,"viewportWidth":host.web.bounds.width,"viewportHeight":host.web.bounds.height,"x":650,"y":80,"width":400,"height":550])
                        guard runtime.state["browserWindowMatchesRoot"] as? Bool == true,runtime.state["shellWindowMatchesRoot"] as? Bool == true,
                          runtime.state["hasHoleMask"] as? Bool == true else { throw failure("The product browser is not embedded with its existing UI") }
                        let found=try await control("find",["tabId":tab,"navigationRevision":revision,"operation":"search","query":"fixture"])
                        guard found["found"] as? Bool == true,(found["total"] as? Int ?? 0)>0 else { throw failure("Native page find returned no actual match") }
                        _=try await control("find",["tabId":tab,"navigationRevision":revision,"operation":"clear","query":""])
                        let created=try await control("newTab");let extra=created["activeTab"] as! String
                        _=try await control("closeTab",["tabId":extra])
                        for _ in 0..<100 {
                          page=try await control("state")
                          if !(page["tabs"] as? [[String:Any]] ?? []).contains(where:{$0["id"] as? String == extra}) { break }
                          try await Task.sleep(nanoseconds:50_000_000)
                        }
                        guard !(page["tabs"] as? [[String:Any]] ?? []).contains(where:{$0["id"] as? String == extra}) else { throw failure("Closed product tab is still present") }
                        _=try await control("selectTab",["tabId":tab])
                        _=try await control("open",["tabId":tab,"url":fixture+"download"])
                        var downloaded:[String:Any]?
                        for _ in 0..<200 {
                          let state=try await host.handle("browser.downloads",["action":"state"]) as! [String:Any]
                          downloaded=(state["items"] as? [[String:Any]])?.first(where:{$0["status"] as? String == "completed"})
                          if downloaded != nil { break };try await Task.sleep(nanoseconds:100_000_000)
                        }
                        guard let path=downloaded?["path"] as? String,try String(contentsOfFile:path,encoding:.utf8)=="QQClaw native download fixture" else { throw failure("Product CEF download did not save the actual fixture content") }
                        let slowTab=(try await control("newTab"))["activeTab"] as! String
                        _=try await control("open",["tabId":slowTab,"url":fixture+"slow"])
                        var started=false
                        for _ in 0..<100 {
                          let state=try await host.handle("browser.downloads",["action":"state"]) as! [String:Any]
                          if (state["items"] as? [[String:Any]] ?? []).contains(where:{$0["url"] as? String == fixture+"slow" && $0["status"] as? String == "running" && (($0["received"] as? NSNumber)?.int64Value ?? 0)>0}) { started=true;break }
                          try await Task.sleep(nanoseconds:50_000_000)
                        }
                        guard started else { throw failure("Slow fixture did not actually start downloading") }
                        _=try await control("closeTab",["tabId":slowTab])
                        var slowDownload:[String:Any]?
                        for _ in 0..<200 {
                          let state=try await host.handle("browser.downloads",["action":"state"]) as! [String:Any]
                          slowDownload=(state["items"] as? [[String:Any]] ?? []).first(where:{$0["url"] as? String == fixture+"slow" && $0["status"] as? String == "completed"})
                          if slowDownload != nil { break };try await Task.sleep(nanoseconds:50_000_000)
                        }
                        guard let slowPath=slowDownload?["path"] as? String,try Data(contentsOf:URL(fileURLWithPath:slowPath)) == Data(repeating:120,count:64*4096),
                          !(try await control("state")["tabs"] as? [[String:Any]] ?? []).contains(where:{$0["id"] as? String == slowTab}) else { throw failure("Closing the tab interrupted or corrupted its download") }
                        _=try await control("selectTab",["tabId":tab])
                        _=try await control("open",["tabId":tab,"url":fixture])
                        for _ in 0..<100 {
                          let state=try await control("state")
                          if state["url"] as? String == fixture,state["loading"] as? Bool == false { break }
                          try await Task.sleep(nanoseconds:50_000_000)
                        }
                        let history=try await host.handle("browser.history",["action":"state"]) as! [String:Any]
                        guard (history["items"] as? [[String:Any]] ?? []).contains(where:{$0["url"] as? String == fixture}) else { throw failure("Product browser history did not preserve the actual page") }
                        print("HOST_BROWSER_UI_PASS: actual page, embedding, find, new/select/close, download content and encrypted history")
                        let official=try await control("prepareOfficial")
                        let bindingRoot=URL(fileURLWithPath:ProcessInfo.processInfo.environment["QQCLAW_HOST_BINDING"]!)
                        try jsonData(["owner":owner,"native":official]).write(to:bindingRoot.appendingPathExtension("ready.json"),options:.atomic)
                        var acknowledged=false
                        for _ in 0..<700 {
                          if let bytes=try? Data(contentsOf:bindingRoot.appendingPathExtension("ack.json")),let result=try? JSONSerialization.jsonObject(with:bytes) as? [String:Any] {
                            guard result["passed"] as? Bool == true else { throw failure("The actual product's official browser binding failed") };acknowledged=true;break
                          }
                          try await Task.sleep(nanoseconds:100_000_000)
                        }
                        guard acknowledged else { throw failure("The actual product's official browser binding timed out") }
                        print("HOST_OFFICIAL_BINDING_PASS")
                        var popup:[String:Any]=[:]
                        for _ in 0..<200 {
                          popup=try await control("state")
                          if popup["title"] as? String == "QQClaw popup fixture",popup["url"] as? String == fixture+"popup" { break }
                          try await Task.sleep(nanoseconds:50_000_000)
                        }
                        guard popup["title"] as? String == "QQClaw popup fixture",popup["url"] as? String == fixture+"popup",let popupId=popup["activeTab"] as? String,popupId != tab,
                          runtime.state["browserWindowMatchesRoot"] as? Bool == true,runtime.state["shellWindowMatchesRoot"] as? Bool == true else { throw failure("The actual official popup and the application's selected tab diverged") }
                        _=try await control("closeTab",["tabId":popupId])
                        print("HOST_POPUP_AND_DOWNLOAD_CLOSE_PASS")
                        let image: NSImage = try await withCheckedThrowingContinuation { continuation in
                          host.web.takeSnapshot(with:nil) { image,error in
                            if let image { continuation.resume(returning:image) }
                            else { continuation.resume(throwing:error ?? failure("The product frontend snapshot failed")) }
                          }
                        }
                        guard let tiff=image.tiffRepresentation,let bitmap=NSBitmapImageRep(data:tiff),let png=bitmap.representation(using:.png,properties:[:]) else { throw failure("The product frontend screenshot failed") }
                        try png.write(to:URL(fileURLWithPath:ProcessInfo.processInfo.environment["QQCLAW_HOST_IMAGE"]!))
                        print("HOST_REQUEST_SAVED_QUIT");host.requestCefQuit()
                      } catch { errorText=error.localizedDescription;print("HOST_FAILURE " + errorText);host.backend?.killGroup();runtime.close() }
                    }
                  }
                }
                try runtime.start(options:host.cefOptions())
                DispatchQueue.main.asyncAfter(deadline:.now()+150) { if !host.allowQuit { errorText="Product Host verification timed out";host.backend?.killGroup();runtime.close() } }
                print("HOST_RUN");runtime.run();print("HOST_LOOP_ENDED")
                if errorText.isEmpty {
                  guard host.allowQuit else { throw failure("The product quit path did not acknowledge saved data") }
                  let disk=try JSONSerialization.jsonObject(with:Data(contentsOf:host.data.appendingPathComponent("state.json"))) as! [String:Any]
                  let plain=try host.vault.handle("vault.decrypt",disk["protected"] as! String)
                  let saved=try JSONSerialization.jsonObject(with:Data(plain.utf8)) as! [String:Any]
                  guard (saved["settings"] as? [String:Any])?["fontSize"] as? Int == 15 else { throw failure("The real backend setting was not persisted") }
                }
                host.applicationWillTerminate(Notification(name:NSApplication.willTerminateNotification))
              } catch { errorText=error.localizedDescription }
              let record:[String:Any]=["passed":errorText.isEmpty,"error":errorText,"scope":"Actual product Swift Host with CEF root, packaged frontend, real empty backend, encrypted setting save and acknowledged quit; no model, WeChat, physical input or final installer."]
              try? jsonData(record).write(to:URL(fileURLWithPath:ProcessInfo.processInfo.environment["QQCLAW_HOST_RESULT"]!))
              if !errorText.isEmpty { fputs(errorText+"\n",stderr);exit(1) }
            }
          }
          `;
          const instrumented=source.slice(0,offset)
            .replace('guard backend === child else { return }','print("HOST_RECV " + String(describing:message["kind"]) + " " + String(describing:message["method"]) + " " + String(describing:message["id"]));guard backend === child else { return }')
            .replace('try child.process.run(); backend = child','try child.process.run();print("HOST_BACKEND_PID "+String(child.process.processIdentifier)); backend = child')
            .replace('while let chunk = try? readPipe(child.errors.fileHandleForReading), !chunk.isEmpty {}','while let chunk = try? readPipe(child.errors.fileHandleForReading), !chunk.isEmpty { print("HOST_BACKEND_STDERR "+String(decoding:chunk.prefix(2048),as:UTF8.self)) }');
          const verifier=path.join(base,'HostPreview.swift');await fs.writeFile(verifier,instrumented+main);
          await run('/usr/bin/xcrun',['swiftc','-swift-version','5','-parse-as-library','-O','-framework','AppKit','-framework','WebKit','-framework','Security','-framework','CryptoKit',verifier,path.join(root,'native/macos/BrowserHost.swift'),path.join(root,'native/macos/CefRuntime.swift'),'-o',binary],{maxBuffer:4*1024*1024});
          for(const arch of ['arm64','x64'])await run('/usr/bin/codesign',['--force','--sign','-',path.join(resources,'node',arch,'bin/node')]);
          await run('/usr/bin/codesign',['--force','--sign','-',app]);
          await run('/usr/bin/codesign',['--verify','--deep','--strict',app]);
          const fixture=http.createServer((request,response)=>{
            if(request.url==='/download'){response.writeHead(200,{'content-type':'application/octet-stream','content-disposition':'attachment; filename="native-proof.txt"'});response.end('QQClaw native download fixture');}
            else if(request.url==='/slow'){response.writeHead(200,{'content-type':'application/octet-stream','content-disposition':'attachment; filename="slow-proof.txt"','content-length':64*4096});let count=0;const timer=setInterval(()=>{response.write(Buffer.alloc(4096,120));if(++count===64){clearInterval(timer);response.end();}},50);response.once('close',()=>clearInterval(timer));}
            else {response.writeHead(200,{'content-type':'text/html; charset=utf-8'});response.end(request.url==='/popup'?'<title>QQClaw popup fixture</title><h1>Actual popup page</h1>':'<!doctype html><meta charset="utf-8"><title>QQClaw Host browser fixture</title><h1>QQClaw native browser fixture</h1><p>Second fixture match.</p><a href="/popup" target="_blank">Open owned popup</a>');}
          });
          await new Promise(resolve=>fixture.listen(0,'127.0.0.1',resolve));
          const bindingRoot=path.join(base,'official-binding');
          const running=run(binary,[],{env:{...process.env,QQCLAW_DATA_DIR:path.join(base,'data'),CODEX_HOME:path.join(base,'codex'),QQCLAW_HOST_FIXTURE:'http://127.0.0.1:'+fixture.address().port+'/',QQCLAW_HOST_BINDING:bindingRoot,QQCLAW_DOWNLOADS_DIR:path.join(base,'downloads'),QQCLAW_HOST_IMAGE:path.join(proof,'host-preview.png'),QQCLAW_HOST_RESULT:path.join(proof,'host-preview.json')},timeout:180000,maxBuffer:2*1024*1024});
          let bindingActive=true;
          const binding=(async()=>{
            try {
              let record;
              while(bindingActive){record=await fs.readFile(bindingRoot+'.ready.json','utf8').then(JSON.parse,()=>null);if(record)break;await new Promise(resolve=>setTimeout(resolve,100));}
              if(!record)throw Error('Product Host exited before official preparation');
              const env={...process.env,QQCLAW_RUNTIME_DIR:resources,QQCLAW_MAC_BROWSER_READY:'1'};
              const installation=await discoverOfficialBrowser({env});if(!installation.available)throw Error(installation.reason);
              const configuration=await prepareOfficialBrowser({session:{id:record.owner},executable:installation.paths.codexCliPath,directory:path.join(base,'data'),discovery:async()=>installation,
                native:async(method,params)=>{if(method!=='browser.control'||params.action!=='prepareOfficial'||params.owner!==record.owner)throw Error('Unexpected product native request');return record.native;}});
              if(!configuration.available||configuration.platform!=='darwin')throw Error('The product official browser configuration is unavailable');
              const turnId=randomUUID();
              const access=await new BrowserAccessHost({authorize:request=>request.sessionId===record.owner&&request.turnId===turnId}).start();
              let runtime;
              try {
                runtime=await openMacOfficialRuntime({cli:installation.paths.codexCliPath,nodeRepl:installation.paths.nodeReplPath,cwd:base,env:{...process.env,...configuration.env,...access.environment}});
                runtime.stderr.resume();runtime.stdout.setEncoding('utf8');let buffer='',next=0;const requests=new Map();
                runtime.stdout.on('data',chunk=>{buffer+=chunk;while(buffer.includes('\n')){const at=buffer.indexOf('\n'),line=buffer.slice(0,at);buffer=buffer.slice(at+1);if(!line.trim())continue;const message=JSON.parse(line),request=requests.get(message.id);
                  if(request){clearTimeout(request.timer);requests.delete(message.id);message.error?request.reject(Error(JSON.stringify(message.error))):request.resolve(message.result);}
                  else if(message.id!==undefined&&message.method){const meta=message.params?._meta||message.params?.meta||{},form=elicitationForm({...message.params,mode:message.params?.mode||'form'}),content=form?simpleConsent(form):null;
                    const allowed=message.method==='elicitation/create'&&meta.connector_id==='browser-use'&&meta.tool_name==='access_browser_origin'&&meta.origin==='http://127.0.0.1:'+fixture.address().port&&meta.tool_params?.origin===meta.origin&&content!==null;
                    if(allowed)validateForm(form,content);
                    runtime.stdin.write(JSON.stringify(message.method==='elicitation/create'?{jsonrpc:'2.0',id:message.id,result:{action:allowed?'accept':'decline',content:allowed?content:null,_meta:null}}:{jsonrpc:'2.0',id:message.id,error:{code:-32601,message:'Outside the owned fixture'}})+'\n');
                  }
                }});
                const request=(method,params)=>new Promise((resolve,reject)=>{const id=++next,timer=setTimeout(()=>{requests.delete(id);reject(Error('Official product popup request timed out'))},45000);requests.set(id,{resolve,reject,timer});runtime.stdin.write(JSON.stringify({jsonrpc:'2.0',id,method,params})+'\n');});
                await request('initialize',{protocolVersion:'2025-06-18',capabilities:{elicitation:{form:{}}},clientInfo:{name:'qqclaw_owned_product_popup_check',version:'1'}});
                runtime.stdin.write(JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'})+'\n');
                const call=async code=>{const result=await request('tools/call',{name:'js',arguments:{code,timeout_ms:30000},_meta:{'x-codex-turn-metadata':{session_id:record.owner,turn_id:turnId,thread_source:'qqclaw_product_popup_check'}}});if(result.isError)throw Error((result.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n'));return result;};
                await call('var {setupBrowserRuntime}=await import('+JSON.stringify(configuration.clientUrl)+');var agent=await setupBrowserRuntime()');
                await call('var browsers=await agent.browsers.list();if(browsers.length!==1)throw Error("Expected one bound browser");var browser=await agent.browsers.get(browsers[0].id);nodeRepl.write(await browser.documentation())');
                const address='http://127.0.0.1:'+fixture.address().port+'/';
                await call('await browser.nameSession("🔎 QQClaw 弹窗检查");var pages=await browser.user.openTabs();var own=pages.find(page=>page.url==='+JSON.stringify(address)+');if(!own)throw Error("The actual product fixture page was not found");var tab=await browser.user.claimTab(own);nodeRepl.write(await tab.playwright.domSnapshot())');
                const popupResult=await call('await tab.playwright.getByRole("link",{name:"Open owned popup",exact:true}).click();nodeRepl.write(await browser.tabs.list())');
                await fs.writeFile(path.join(proof,'host-official-popup.json'),JSON.stringify(popupResult,null,2));
              } finally {if(runtime)await runtime.close();await access.close();}
              await fs.writeFile(path.join(proof,'host-official-binding.json'),JSON.stringify({passed:true,owner:record.owner,engine:configuration.engine,platform:configuration.platform,tabCreation:configuration.tabCreation,approvalSource:'isolated-fixture-owner',scope:'Production prepareOfficialBrowser with the actual Swift Host profile, packaged original runtime, copied original host, original identity API and actual link click opening a popup. No model or WeChat.'},null,2));
              await fs.writeFile(bindingRoot+'.ack.json',JSON.stringify({passed:true}));
            }catch(error){await fs.writeFile(path.join(proof,'host-official-binding.json'),JSON.stringify({passed:false,error:error.message},null,2));await fs.writeFile(bindingRoot+'.ack.json',JSON.stringify({passed:false}));throw error;}
          })();
          binding.catch(()=>{});
          let sampling;
          const timer=setTimeout(()=>{if(running.child?.pid)sampling=run('/usr/bin/sample',[String(running.child.pid),'1','1','-file',path.join(proof,'host-native-sample.log')],{timeout:10000,maxBuffer:1024*1024}).catch(error=>fs.writeFile(path.join(proof,'host-sample-error.log'),error.message));},12000);
          try {const result=await running;await fs.writeFile(path.join(proof,'host-preview.log'),result.stdout+result.stderr);await binding;}
          catch(error){await fs.writeFile(path.join(proof,'host-preview.log'),(error.stdout||'')+(error.stderr||'')+'\n'+error.message);throw error;}
          finally {bindingActive=false;await binding.catch(()=>{});fixture.closeAllConnections();await new Promise(resolve=>fixture.close(resolve));clearTimeout(timer);if(sampling)await sampling;const log=path.join(base,'data/logs/backend.log');await fs.copyFile(log,path.join(proof,'host-backend.log')).catch(()=>{});}

          NODE
      - name: Preserve crash diagnostics from the owned native components
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import os from 'node:os';
          const reports=path.join(os.homedir(),'Library/Logs/DiagnosticReports');
          const output=path.join(process.env.RUNNER_TEMP,'official-browser-proof');await fs.mkdir(output,{recursive:true});
          for(const name of await fs.readdir(reports).catch(()=>[]))if(/^QQClaw(?:Browser)?[-_].*\.ips$/.test(name))await fs.copyFile(path.join(reports,name),path.join(output,name));
          NODE
      - name: Build the self-contained universal browser candidate
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';import {buildMac} from './scripts/build-macos.mjs';
          await buildMac(process.cwd(),{browserBuild:path.join(process.env.RUNNER_TEMP,'browser-build/mac-browser-build.json'),runtimeCache:path.join(process.env.RUNNER_TEMP,'official-runtime'),output:path.join(process.env.RUNNER_TEMP,'mac-browser-candidate/QQClaw.dmg')});
          NODE
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mac-official-browser-candidate
          path: ${{ runner.temp }}/mac-browser-candidate/QQClaw.dmg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-official-browser-evidence
          path: |
            ${{ runner.temp }}/official-browser-profiles/*.json
            ${{ runner.temp }}/official-browser-profiles/*.log
            ${{ runner.temp }}/official-browser-profiles/*.png
            ${{ runner.temp }}/official-browser-profiles/*.jpg
            ${{ runner.temp }}/official-browser-proof/*.ips
            ${{ runner.temp }}/official-browser-proof/*.json
            ${{ runner.temp }}/official-browser-proof/*.log
            ${{ runner.temp }}/official-browser-proof/*.png
            ${{ runner.temp }}/official-browser-proof/*.jpg
            ${{ runner.temp }}/official-browser-proof/profile/cef.log
            ${{ runner.temp }}/browser-build/mac-browser-build.json
          if-no-files-found: warn
          retention-days: 7
